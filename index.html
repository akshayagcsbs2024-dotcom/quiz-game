<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcome-screen">
  <h1>Hey Friend 😎</h1>
  <p>Let’s see how well you know me!</p>
  <button onclick="startQuiz()">Start Quiz</button>
</div>

<div class="quiz-container" id="quiz-box">
  <h2 id="question"></h2>

  <div id="answers">
    <button onclick="checkAnswer(0)"></button>
    <button onclick="checkAnswer(1)"></button>
    <button onclick="checkAnswer(2)"></button>
    <button onclick="checkAnswer(3)"></button>
  </div>

  <p id="result"></p>
  <p id="score"></p>
</div>

<canvas id="canvas"></canvas>

<script src="script.js"></script>
</body>
</html>
